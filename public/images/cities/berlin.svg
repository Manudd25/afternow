<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 686" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a2744"/>
      <stop offset="60%" stop-color="#2d4a6f"/>
      <stop offset="100%" stop-color="#4a6741"/>
    </linearGradient>
    <linearGradient id="glow" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="686" fill="url(#sky)"/>
  <rect width="1600" height="400" fill="url(#glow)"/>
  <!-- Brandenburg Gate silhouette -->
  <rect x="680" y="280" width="240" height="220" fill="#0f172a" opacity="0.7"/>
  <rect x="710" y="240" width="40" height="260" fill="#1e293b"/>
  <rect x="850" y="240" width="40" height="260" fill="#1e293b"/>
  <rect x="770" y="200" width="60" height="300" fill="#1e293b"/>
  <rect x="620" y="320" width="360" height="30" fill="#334155"/>
  <!-- City skyline -->
  <rect x="0" y="420" width="120" height="266" fill="#0f172a" opacity="0.6"/>
  <rect x="140" y="380" width="80" height="306" fill="#0f172a" opacity="0.5"/>
  <rect x="260" y="400" width="100" height="286" fill="#0f172a" opacity="0.55"/>
  <rect x="400" y="360" width="70" height="326" fill="#0f172a" opacity="0.5"/>
  <rect x="960" y="390" width="90" height="296" fill="#0f172a" opacity="0.55"/>
  <rect x="1100" y="350" width="110" height="336" fill="#0f172a" opacity="0.6"/>
  <rect x="1280" y="410" width="80" height="276" fill="#0f172a" opacity="0.5"/>
  <rect x="1420" y="370" width="180" height="316" fill="#0f172a" opacity="0.55"/>
  <!-- Trees / greenery -->
  <ellipse cx="200" cy="500" rx="60" ry="80" fill="#166534" opacity="0.4"/>
  <ellipse cx="500" cy="520" rx="50" ry="70" fill="#166534" opacity="0.35"/>
  <ellipse cx="1200" cy="510" rx="70" ry="85" fill="#166534" opacity="0.4"/>
  <!-- Ground -->
  <rect x="0" y="580" width="1600" height="106" fill="#0a0f1a"/>
  <rect x="0" y="580" width="1600" height="4" fill="#334155" opacity="0.5"/>
</svg>
