name = "afternow-image-worker"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[ai]
binding = "AI"

[dev]
port = 8787

[vars]
# Comma-separated allowed frontend origins (no trailing slashes). Add your Netlify URL after deploy.
ALLOWED_ORIGINS = "http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174,http://localhost:8888,http://127.0.0.1:8888,https://after-now.netlify.app"
MAX_PROMPT_LENGTH = "2000"
RATE_LIMIT_WINDOW_MS = "60000"
RATE_LIMIT_MAX_REQUESTS = "10"

# Optional: override the Workers AI model
# AI_MODEL = "@cf/black-forest-labs/flux-2-klein-4b"
